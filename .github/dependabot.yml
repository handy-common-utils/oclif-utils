version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # The root directory where parsing normally starts
    schedule:
      interval: "weekly"
    
    # Specify the directories you want to ignore
    exclude-paths:
      - "test/simple-cli-prj-v2/**"
      - "test/simple-cli-prj-v3/**"
      - "test/simple-cli-prj-v4/**"
      - "test/simple-cli-prj-v5/**"
